previews:
  generation: "off"

services:
  - type: web
    name: scamshield-api
    runtime: python
    rootDir: backend
    branch: feature/api-integration
    plan: free
    autoDeployTrigger: "off"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: >-
      python -m uvicorn main:app --host 0.0.0.0 --port "$PORT"
      --workers 1 --limit-concurrency 64 --no-proxy-headers --no-access-log
    envVars:
      - key: PYTHON_VERSION
        value: "3.14.10"
      - key: SCAMSHIELD_LOOKUP
        value: "0"
      - key: SCAMSHIELD_PUBLIC_MODE
        value: "1"
